[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mintalib"
version = "0.1.9"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
description = "Minimal Technical Analysis Library for Python"
authors = [{ name = "Furechan", email = "furechan@xsmail.com" }]
dependencies = ["numpy"]
optional-dependencies.pandas = ["pandas"]
optional-dependencies.polars = ["polars"]
optional-dependencies.all = ["pandas", "polars"]
keywords = [
    "technical-analysis",
    "indicators",
    "pandas",
    "polars",
    "finance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Documentation = "https://furechan.github.io/mintalib/"
Source = "https://github.com/furechan/mintalib"
Issues = "https://github.com/furechan/mintalib/issues"
Changelog = "https://github.com/furechan/mintalib/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "setuptools",
    "cython",
    "invoke",
    "ipykernel",
    "pytest",
    "nbmake",
    "ruff",
    "pandas",
    "polars",
    "yfinance",
    "nbcheck",
    "tabulate",
    "pytest-sugar>=1.0.0",
    "ta-lib>=0.6.8",
    "griffe>=2.1.0",
    "ty>=0.0.75",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs-jupyter>=0.26.3",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
addopts = ["-p no:cacheprovider"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401", "F811"]

# Some playground notebooks define names dynamically, which ty cannot resolve. Inline
# `# ty: ignore[...]` file-level directives don't work in the IDE — the ty language server
# analyzes notebook cells individually — so the rules are ignored per filename pattern instead.
# Naming convention: notebooks with %%cython magic cells have "cython" in the name.
[[tool.ty.overrides]]
include = ["playground/*cython*.ipynb"]
rules.unresolved-reference = "ignore"
