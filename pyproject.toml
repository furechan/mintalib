[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mintalib"
version = "0.1.5"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
description = "Minimal Technical Analysis Library for Python"
urls.homepage = "https://github.com/furechan/mintalib"
urls.documentation = "https://furechan.github.io/mintalib/"
urls.repository = "https://github.com/furechan/mintalib"
urls.changelog = "https://github.com/furechan/mintalib/blob/main/CHANGELOG.md"
authors = [{ name = "Furechan", email = "furechan@xsmail.com" }]
dependencies = ["numpy"]
optional-dependencies.pandas = ["pandas"]
optional-dependencies.polars = ["polars"]
optional-dependencies.all = ["pandas", "polars"]
keywords = ["cython", "technical-analysis", "indicators"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "setuptools",
    "cython",
    "invoke",
    "ipykernel",
    "pytest",
    "nbmake",
    "pyright",
    "ruff",
    "pandas",
    "polars",
    "yfinance",
    "twine",
    "nbcheck",
    "tabulate",
    "pytest-sugar>=1.0.0",
    "ta-lib>=0.6.8",
    "griffe>=2.1.0",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs-jupyter>=0.26.3",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
addopts = ["-p no:cacheprovider"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F401", "F811"]
"__init__.py" = ["F401"]
"functions.py" = ["F401"]

# Some playground notebooks define names dynamically, which ty cannot resolve. Inline
# `# ty: ignore[...]` file-level directives don't work in the IDE — the ty language server
# analyzes notebook cells individually — so the rules are ignored per filename pattern instead.
# Naming convention: notebooks with %%cython magic cells have "cython" in the name,
# notebooks using the registered ts accessors have "accessor" in the name.
[[tool.ty.overrides]]
include = ["playground/*cython*.ipynb"]
rules.unresolved-reference = "ignore"

[[tool.ty.overrides]]
include = ["playground/*accessor*.ipynb"]
rules.unresolved-attribute = "ignore"
