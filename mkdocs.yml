site_name: mintalib
site_description: Minimal technical analysis library for Python, implemented in Cython
site_url: https://furechan.github.io/mintalib/
site_dir: build/site
repo_url: https://github.com/furechan/mintalib
repo_name: furechan/mintalib

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocs-jupyter:
      cache_dir: build/cache/mkdocs-jupyter
      execute: false
      include_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
