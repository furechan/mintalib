name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run mkdocs build --site-dir _site/
      # Google Search Console ownership verification (account-level token, not a secret)
      - run: |
          echo "google-site-verification: google3e5afa36401ddb09.html" > _site/google3e5afa36401ddb09.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v4
