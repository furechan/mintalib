# Build, test, and verify one complete release artifact set.
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            runner: macos-14
            arch: arm64
          - name: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - name: windows-x64
            runner: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.2.0
        with:
          extras: uv
        env:
          # One cp311-abi3 wheel supports regular CPython 3.11 and newer.
          CIBW_BUILD: cp311-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_TEST_EXTRAS: all
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest -q {project}/tests

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Smoke-test sdist
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/python -m pip install dist/*.tar.gz pandas polars pytest
          .venv-smoke/bin/python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify release artifacts
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Verify artifact set
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          [[ ${#wheels[@]} -eq 5 ]] || {
            echo "::error::expected 5 wheels, found ${#wheels[@]}"
            exit 1
          }
          [[ ${#sdists[@]} -eq 1 ]] || {
            echo "::error::expected 1 sdist, found ${#sdists[@]}"
            exit 1
          }
          printf '%s\n' "${wheels[@]}" "${sdists[@]}"
